services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flowdesk
      POSTGRES_USER: flowdesk
      POSTGRES_PASSWORD: flowdesk
    ports:
      - "5432:5432"
    volumes:
      - flowdesk_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowdesk -d flowdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://flowdesk:flowdesk@postgres:5432/flowdesk?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-flowdesk-local-change-me}
      SESSION_COOKIE_SECURE: "false"
      UPLOAD_DIR: /app/data/uploads
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@flowdesk.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Flowdesk@123}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    volumes:
      - flowdesk_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  flowdesk_postgres:
  flowdesk_uploads:
